<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">CherryQ execution comparison</title>
  <desc id="desc">Two panels compare optimal-plan probability for the five-invoice Aalto Q20 runs and the ten-invoice ideal, Garnet mock, real Garnet and VTT Q50 runs.</desc>
  <defs>
    <linearGradient id="bar5" x1="0" x2="1">
      <stop offset="0" stop-color="#45d7e6"/>
      <stop offset="1" stop-color="#55e6a5"/>
    </linearGradient>
    <linearGradient id="bar10" x1="0" x2="1">
      <stop offset="0" stop-color="#9b7cff"/>
      <stop offset="1" stop-color="#ec3f58"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="24" fill="#0d1429"/>
  <text x="42" y="52" fill="#f8f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800">CherryQ execution comparison</text>
  <text x="42" y="80" fill="#9ba8c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Optimal-plan probability; Exact/MILP is deterministic ground truth rather than a sampling bar.</text>

  <g transform="translate(38,112)" filter="url(#shadow)">
    <rect width="450" height="480" rx="18" fill="#111a31" stroke="#263252"/>
    <text x="24" y="38" fill="#45d7e6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">5-INVOICE BENCHMARK</text>
    <text x="24" y="70" fill="#f8f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750">Classical truth: A+B+D · £600</text>
    <text x="24" y="96" fill="#9ba8c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Two independent physical Aalto Q20 executions</text>

    <text x="24" y="150" fill="#dfe7f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Q20 run 1</text>
    <rect x="24" y="168" width="370" height="24" rx="12" fill="#18223d"/>
    <rect x="24" y="168" width="296" height="24" rx="12" fill="url(#bar5)"/>
    <text x="330" y="186" fill="#f8f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800">4.8%</text>
    <text x="24" y="214" fill="#9ba8c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">48 / 1,000 optimal shots · 95 CZ · depth 120</text>

    <text x="24" y="270" fill="#dfe7f7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Q20 run 2</text>
    <rect x="24" y="288" width="370" height="24" rx="12" fill="#18223d"/>
    <rect x="24" y="288" width="333" height="24" rx="12" fill="url(#bar5)"/>
    <text x="367" y="306" fill="#f8f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800">5.4%</text>
    <text x="24" y="334" fill="#9ba8c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">54 / 1,000 optimal shots · 79 CZ · depth 111</text>

    <rect x="24" y="380" width="402" height="72" rx="12" fill="#10251f" stroke="#55e6a5" stroke-opacity=".28"/>
    <text x="42" y="407" fill="#caffdf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800">Result</text>
    <text x="42" y="431" fill="#b9c8de" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Both physical runs recovered the classically verified optimum.</text>
  </g>

  <g transform="translate(512,112)" filter="url(#shadow)">
    <rect width="650" height="480" rx="18" fill="#111a31" stroke="#263252"/>
    <text x="24" y="38" fill="#9b7cff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">10-INVOICE BENCHMARK</text>
    <text x="24" y="70" fill="#f8f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="750">Classical truth: A+B+F+G+H · £950</text>
    <text x="24" y="96" fill="#9ba8c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Same frozen γ, β and p=1 across ideal, mock and real hardware</text>

    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">
      <text x="24" y="140" fill="#dfe7f7">Ideal QAOA</text>
      <rect x="164" y="126" width="390" height="20" rx="10" fill="#18223d"/>
      <rect x="164" y="126" width="376" height="20" rx="10" fill="url(#bar10)"/>
      <text x="566" y="141" fill="#f8f9ff" font-weight="800">3.4683%</text>

      <text x="24" y="184" fill="#dfe7f7">Garnet mock · original</text>
      <rect x="164" y="170" width="390" height="20" rx="10" fill="#18223d"/>
      <rect x="164" y="170" width="88" height="20" rx="10" fill="url(#bar10)"/>
      <text x="264" y="185" fill="#f8f9ff" font-weight="800">0.8133%</text>

      <text x="24" y="228" fill="#dfe7f7">Garnet mock · reordered</text>
      <rect x="164" y="214" width="390" height="20" rx="10" fill="#18223d"/>
      <rect x="164" y="214" width="87" height="20" rx="10" fill="url(#bar10)"/>
      <text x="263" y="229" fill="#f8f9ff" font-weight="800">0.8000%</text>

      <text x="24" y="272" fill="#dfe7f7">Real Garnet · original</text>
      <rect x="164" y="258" width="390" height="20" rx="10" fill="#18223d"/>
      <circle cx="168" cy="268" r="4" fill="#ec3f58"/>
      <text x="180" y="273" fill="#f8f9ff" font-weight="800">0.0% · best loss £1,000</text>

      <text x="24" y="316" fill="#dfe7f7">Real Garnet · reordered</text>
      <rect x="164" y="302" width="390" height="20" rx="10" fill="#18223d"/>
      <rect x="164" y="302" width="22" height="20" rx="10" fill="url(#bar10)"/>
      <text x="198" y="317" fill="#f8f9ff" font-weight="800">0.2% · 2 / 1,000 · £950</text>

      <text x="24" y="360" fill="#dfe7f7">Real Q50 · original</text>
      <rect x="164" y="346" width="390" height="20" rx="10" fill="#18223d"/>
      <rect x="164" y="346" width="11" height="20" rx="10" fill="url(#bar10)"/>
      <text x="187" y="361" fill="#f8f9ff" font-weight="800">0.1% · 1 / 1,000 · £950</text>

      <text x="24" y="404" fill="#dfe7f7">Real Q50 · reordered</text>
      <rect x="164" y="390" width="390" height="20" rx="10" fill="#18223d"/>
      <rect x="164" y="390" width="22" height="20" rx="10" fill="url(#bar10)"/>
      <text x="198" y="405" fill="#f8f9ff" font-weight="800">0.2% · 2 / 1,000 · £950</text>
    </g>

    <text x="24" y="448" fill="#9ba8c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Q50 recovered the optimum in both schedules, but did not show statistically convincing better sampling than Garnet.</text>
  </g>
</svg>
