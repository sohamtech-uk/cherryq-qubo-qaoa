name: Export CherryQ simulation results

on:
  push:
    branches: [feature/resonance-mock-comparison]
    paths:
      - .github/workflows/resonance-export.yml
      - scripts/export_resonance_artifacts.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for run 37916961742 and export nonsecret result files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/export_resonance_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: CherryQ-Resonance-Raw-Results
          path: CherryQ_Resonance_Raw_Results.zip
          retention-days: 30
