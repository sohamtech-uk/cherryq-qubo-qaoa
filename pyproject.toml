[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cherryq-prototype"
version = "0.1.0"
description = "CherryQ hackathon prototype for predictive cash scenarios and QUBO/QAOA supplier-payment optimisation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "qiskit>=2.5.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
hardware = [
  "qiskit-ibm-runtime>=0.47,<1",
]
iqm = [
  "iqm-client[qiskit]",
]

[project.scripts]
cherryq-demo = "cherryq.demo:main"
cherryq-research = "cherryq.research:main"
cherryq-q20 = "cherryq.hardware.q20:main"
cherryq-scaling = "cherryq.scaling:main"
cherryq-ten = "cherryq.ten_invoice:main"
cherryq-q20-ten = "cherryq.hardware.q20_ten:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
